<style>
        .card-selected {

<!-- Script to handle multi-select toggle -->
<script>
        function toggleCard(element) {
            if (element.classList.contains('card-unselected')) {
                element.classList.remove('card-unselected');
                element.classList.add('card-selected');
            } else {
                element.classList.remove('card-selected');
                element.classList.add('card-unselected');
            }
            // In a real app, you might validate if at least one is selected to enable the continue button.
            // For this prompt, it says multi-select allowed, implying it could be optional, 
            // but usually gamified flows allow proceeding anyway or require at least one.
        }
    </script>
