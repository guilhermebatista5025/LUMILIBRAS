<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container pb-[100px] md:max-w-2xl md:mx-auto">

<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Meta diária</h1>

<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
</label>
<!-- Option 2: 10 minutes (Recommended) - HIGHLIGHTED -->
<label class="cursor-pointer group relative flex items-center p-base rounded-xl border-2 border-primary bg-primary-container/10 transition-colors shadow-sm overflow-hidden">

<!-- Script for handling radio button selection styling (visual feedback only) -->
<script>
        const labels = document.querySelectorAll('label');
        const radios = document.querySelectorAll('input[type="radio"]');

        function updateSelection() {
            labels.forEach(label => {
                const input = label.querySelector('input');
                if (input.checked) {
                    label.classList.remove('border-surface-container-highest', 'bg-surface-container-lowest', 'hover:bg-surface-container-low');
                    label.classList.add('border-primary', 'bg-primary-container/10');
                    const text = label.querySelector('.text-on-surface');
                    if(text) {
                        text.classList.replace('text-on-surface', 'text-primary-container');
                        text.classList.replace('font-label-lg', 'font-headline-md');
                    }
                } else {
                    label.classList.add('border-surface-container-highest', 'bg-surface-container-lowest', 'hover:bg-surface-container-low');
                    label.classList.remove('border-primary', 'bg-primary-container/10');
                    const text = label.querySelector('.text-primary-container');
                    if(text && input.value !== '10') { // Keep recommended text styled slightly differently if needed, but for dynamic fallback:
                        text.classList.replace('text-primary-container', 'text-on-surface');
                        text.classList.replace('font-headline-md', 'font-label-lg');
                    }
                }
            });
        }

        radios.forEach(radio => {
            radio.addEventListener('change', updateSelection);
        });
        
        // Initial setup for non-pre-selected items to ensure they behave on click
        // Note: In a real app with frameworks, this state is handled reactively.
    </script>
