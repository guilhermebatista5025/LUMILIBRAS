<!DOCTYPE html><html lang="pt-br"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;family=Work+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#111c2c",
                    "surface-container": "#e6eeff",
                    "tertiary-container": "#cba81b",
                    "surface-bright": "#f9f9ff",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed-variant": "#3c4d00",
                    "error": "#ba1a1a",
                    "on-tertiary-fixed": "#231b00",
                    "error-container": "#ffdad6",
                    "primary-container": "#1267d6",
                    "primary": "#004fac",
                    "tertiary-fixed": "#ffe07e",
                    "on-primary-fixed": "#001a41",
                    "on-primary-container": "#e7ecff",
                    "on-primary": "#ffffff",
                    "tertiary": "#725c00",
                    "surface": "#f9f9ff",
                    "secondary-fixed-dim": "#acd600",
                    "tertiary-fixed-dim": "#e9c339",
                    "on-tertiary-container": "#4d3e00",
                    "on-secondary-fixed": "#161e00",
                    "background": "#f9f9ff",
                    "primary-fixed": "#d8e2ff",
                    "surface-container-highest": "#d8e3f9",
                    "secondary": "#516600",
                    "outline-variant": "#c2c6d6",
                    "on-secondary-container": "#556b00",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f0f3ff",
                    "on-tertiary-fixed-variant": "#564500",
                    "on-surface-variant": "#424753",
                    "on-error": "#ffffff",
                    "outline": "#727785",
                    "surface-container-lowest": "#ffffff",
                    "on-background": "#111c2c",
                    "secondary-fixed": "#c6f323",
                    "surface-container-high": "#dee9ff",
                    "inverse-on-surface": "#ebf1ff",
                    "surface-tint": "#005ac2",
                    "inverse-surface": "#263141",
                    "surface-variant": "#d8e3f9",
                    "on-tertiary": "#ffffff",
                    "surface-dim": "#cfdaf0",
                    "primary-fixed-dim": "#adc6ff",
                    "secondary-container": "#c3f01f",
                    "on-primary-fixed-variant": "#004494",
                    "inverse-primary": "#adc6ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "xl": "24px",
                    "xxl": "32px",
                    "huge": "40px",
                    "giant": "48px",
                    "md": "12px",
                    "base": "16px",
                    "sm": "8px",
                    "lg": "20px"
            },
            "fontFamily": {
                    "body-lg": ["Work Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "label-sm": ["Work Sans"],
                    "label-lg": ["Work Sans"],
                    "body-md": ["Work Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-3d-secondary {
            box-shadow: 0 4px 0 0 #3c4d00;
        }
        .btn-3d-secondary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #3c4d00;
        }
        .btn-3d-primary {
            box-shadow: 0 4px 0 0 #004494;
        }
        .btn-3d-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 #004494;
        }
        .card-match {
            box-shadow: 0 4px 0 0 #c2c6d6;
        }
        .card-match-selected {
            box-shadow: 0 4px 0 0 #004494;
        }
        .progress-pattern {
            background-image: linear-gradient(45deg, rgba(255,255,255,0.2) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.2) 75%, transparent 75%, transparent);
            background-size: 20px 20px;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 px-base pt-md bg-background z-50">
<div class="flex items-center justify-between w-full max-w-7xl mx-auto h-16">
<button class="text-primary hover:opacity-80 Active: scale-95 transition-transform">
<span class="material-symbols-outlined text-[32px]">close</span>
</button>
<div class="flex-1 px-huge">
<div class="h-4 w-full bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full w-[80%] bg-secondary-fixed progress-pattern transition-all duration-500 rounded-full"></div>
</div>
</div>
<div class="flex items-center gap-sm">
<span class="font-headline-md text-headline-md text-primary">8/10</span>
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
</div>
</header>
<main class="flex-1 w-full max-w-4xl mx-auto px-base py-xl flex flex-col gap-huge relative">
<!-- Instruction Section -->
<div class="flex items-start gap-base">
<div class="w-24 h-24 flex-shrink-0 relative">
<img alt="Lumi the mascot giving a thumbs up" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAlFT6Vk-we36nLmjpz_Xbea8eNlCJc_Yd5iC7urJm8s7oku6VQCA-fDoae9XPKyklIGfPDbp2njEg5qkksoisTn_q11Z6J9jvDQoo-k3ev25guYOO1vs97_JBLwVee4UnGYms7G-AH2fh5kjPjX9E50q29iJ2MMWXsa7IshZSgobFSjiZTKTF54xPGshTNy0dgbtR_Biwh-vsVvvXXODlSLw3jSN7T1iL3MSaNTb_meo1MlgXzPO8VDGezVDopxmKc8A">
</div>
<div class="bg-surface-container p-base rounded-xl border-2 border-primary-container relative">
<div class="absolute -left-2 top-6 w-4 h-4 bg-surface-container border-l-2 border-b-2 border-primary-container rotate-45"></div>
<p class="font-headline-md text-headline-md text-on-surface-variant">Combine os pares!</p>
</div>
</div>
<!-- Matching Grid -->
<div class="grid grid-cols-2 gap-xl flex-1">
<!-- Libras Signs Column -->
<div class="flex flex-col gap-md">
<button class="group card-match-selected bg-primary-container p-xl rounded-xl border-2 border-primary transition-all flex items-center justify-center h-32">
<div class="w-20 h-20 bg-white/20 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-6xl" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</div>
</button>
<button class="group card-match bg-surface-container-lowest p-xl rounded-xl border-2 border-outline-variant hover:border-primary-fixed hover:bg-surface-container-low transition-all flex items-center justify-center h-32">
<div class="w-20 h-20 bg-surface-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-6xl" data-icon="school">school</span>
</div>
</button>
<button class="group card-match bg-surface-container-lowest p-xl rounded-xl border-2 border-outline-variant hover:border-primary-fixed hover:bg-surface-container-low transition-all flex items-center justify-center h-32">
<div class="w-20 h-20 bg-surface-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-6xl" data-icon="group">group</span>
</div>
</button>
</div>
<!-- Words Column -->
<div class="flex flex-col gap-md">
<button class="group card-match bg-surface-container-lowest p-xl rounded-xl border-2 border-outline-variant hover:border-primary-fixed hover:bg-surface-container-low transition-all flex items-center justify-center h-32">
<span class="font-headline-md text-headline-md text-on-surface-variant">Amigo</span>
</button>
<button class="group card-match-selected bg-primary-container p-xl rounded-xl border-2 border-primary transition-all flex items-center justify-center h-32">
<span class="font-headline-md text-headline-md text-on-primary-container">Casa</span>
</button>
<button class="group card-match bg-surface-container-lowest p-xl rounded-xl border-2 border-outline-variant hover:border-primary-fixed hover:bg-surface-container-low transition-all flex items-center justify-center h-32">
<span class="font-headline-md text-headline-md text-on-surface-variant">Escola</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Task-specific Footer) -->
<footer class="fixed bottom-0 left-0 w-full flex justify-between items-center px-base py-lg bg-surface-container-lowest dark:bg-on-surface border-t-4 border-surface-container-high z-50">
<div class="max-w-7xl mx-auto w-full flex justify-between items-center">
<!-- Secondary Action (Placeholder for skipping or hint) -->
<button class="flex flex-col items-center justify-center text-outline py-base px-xl hover:bg-surface-container-high rounded-xl transition-colors">
<span class="material-symbols-outlined">help</span>
<span class="font-label-lg text-label-lg">Dica</span>
</button>
<!-- Primary Action: Check -->
<button class="btn-3d-secondary bg-secondary-container text-on-secondary-container rounded-xl py-base px-xxl border-b-4 border-secondary flex items-center gap-sm Active: translate-y-1 transition-all duration-100">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
<span class="font-headline-md text-headline-md">VERIFICAR</span>
</button>
</div>
</footer>
<!-- Atmosphere micro-animation (Floating Particles) -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-1/4 left-10 w-4 h-4 bg-primary-fixed rounded-full opacity-20 animate-bounce" style="animation-delay: 0.2s"></div>
<div class="absolute bottom-1/3 right-20 w-6 h-6 bg-secondary-fixed rounded-full opacity-20 animate-pulse" style="animation-delay: 0.5s"></div>
<div class="absolute top-1/2 left-1/2 w-3 h-3 bg-tertiary-fixed rounded-full opacity-20 animate-bounce" style="animation-delay: 0.8s"></div>
</div>
</body></html>
