<!DOCTYPE html><html class="light" lang="pt-br"><head>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .pressable-button {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            box-shadow: 0 4px 0 0 rgba(0, 0, 0, 0.2);
        }
        .pressable-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.2);
        }
        .pressable-card {
            transition: transform 0.1s ease, border-color 0.2s ease;
        }
        .pressable-card:active {
            transform: scale(0.98);
        }
        .progress-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
        }
        @keyframes bounce-subtle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-lumi {
            animation: bounce-subtle 2s ease-in-out infinite;
        }
    </style>

<body class="bg-background text-on-background font-body-md overflow-x-hidden min-h-screen flex flex-col">

<!-- Progress Bar -->

</div>
<div class="flex items-center gap-xs">

</div>
<div class="mt-base bg-surface-container-highest p-base rounded-xl relative after:content-[''] after:absolute after:bottom-full after:left-1/2 after:-translate-x-1/2 after:border-8 after:border-transparent after:border-b-surface-container-highest">

</div>
</div>
<div class="flex gap-base">

</div>
</button>
</div>
</div>
</div>
<!-- Padding for bottom bar -->
<div class="h-32"></div>
<script>
        // Micro-interaction for Lumi celebration
        document.addEventListener('DOMContentLoaded', () => {
            const confettiColors = ['#004fac', '#acd600', '#cba81b', '#ba1a1a'];
            
            // Trigger simple celebration effect
            const triggerCelebration = () => {
                const container = document.body;
                for(let i=0; i<30; i++) {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = confettiColors[Math.floor(Math.random() * confettiColors.length)];
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '2px';
                    confetti.style.zIndex = '100';
                    confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                    container.appendChild(confetti);

                    const animation = confetti.animate([
                        { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                        { transform: `translate(${(Math.random() - 0.5) * 200}px, 100vh) rotate(${Math.random() * 1000}deg)`, opacity: 0 }
                    ], {
                        duration: 2000 + Math.random() * 2000,
                        easing: 'cubic-bezier(0, .9, .57, 1)'
                    });

                    animation.onfinish = () => confetti.remove();
                }
            };

            // Run once on load to simulate post-correct-answer state
            setTimeout(triggerCelebration, 500);
        });
    </script>
</body></html>
