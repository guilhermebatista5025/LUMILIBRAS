<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LumiLibras — Teste das mãos</title>
<style>
  body { font: 18px system-ui, sans-serif; max-width: 900px; margin: 32px auto; padding: 0 20px; background: #f6f8fa; color: #172b36; }
  button { font: inherit; padding: 10px 20px; margin-right: 8px; cursor: pointer; }
  .camera { position: relative; width: 100%; aspect-ratio: 4/3; background: #172b36; margin-top: 20px; }
  video, canvas { position: absolute; width: 100%; height: 100%; object-fit: contain; }
  video { transform: scaleX(-1); }
  #status { min-height: 1.5em; }
</style>
<main>
  <h1>Teste das mãos</h1>
  <p>Ative a câmera e mostre uma ou duas mãos inteiras. Abra e feche os dedos para acompanhar os pontos.</p>
  <p>O processamento acontece neste navegador. Esta página não grava nem envia o vídeo.</p>
  <button id="iniciar">Ativar câmera</button>
  <button id="parar" disabled>Desligar câmera</button>
  <p id="status" role="status">Câmera desligada.</p>
  <p id="resultado">Mãos detectadas: 0</p>
  <div class="camera"><video autoplay muted playsinline aria-label="Imagem da câmera"></video><canvas aria-label="Pontos das mãos"></canvas></div>
</main>
<script type="module">
  const video = document.querySelector('video');
  const canvas = document.querySelector('canvas');
  const contexto = canvas.getContext('2d');
  const status = document.querySelector('#status');
  const resultado = document.querySelector('#resultado');
  const iniciar = document.querySelector('#iniciar');
  const parar = document.querySelector('#parar');
  const conexoes = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
  let stream, worker, animacao, prazo, sessao = 0, pronto = false, ocupado = false, ultimoTempo = -1;

  function desligar(mensagem = 'Câmera desligada.') {
    sessao++;
    clearTimeout(prazo);
    cancelAnimationFrame(animacao);
    worker?.terminate();
    worker = null;
    stream?.getTracks().forEach(track => track.stop());
    stream = null;
    video.srcObject = null;
    pronto = ocupado = false;
    ultimoTempo = -1;
    contexto.clearRect(0, 0, canvas.width, canvas.height);
    iniciar.disabled = false;
    parar.disabled = true;
    status.textContent = mensagem;
    resultado.textContent = 'Mãos detectadas: 0';
  }

  function desenhar(dados) {
    contexto.clearRect(0, 0, canvas.width, canvas.height);
    for (const [indice, pontos] of dados.landmarks.entries()) {
      const cor = indice === 0 ? '#53ffbc' : '#ffe26b';
      const tela = p => [(1 - p.x) * canvas.width, p.y * canvas.height];
      contexto.strokeStyle = cor;
      contexto.lineWidth = 3;
      for (const [a,b] of conexoes) {
        contexto.beginPath();
        contexto.moveTo(...tela(pontos[a]));
        contexto.lineTo(...tela(pontos[b]));
        contexto.stroke();
      }
      contexto.fillStyle = cor;
      for (const ponto of pontos) {
        contexto.beginPath();
        contexto.arc(...tela(ponto), 4, 0, Math.PI * 2);
        contexto.fill();
      }
    }
    resultado.textContent = `Mãos detectadas: ${dados.landmarks.length} · Pontos: ${dados.landmarks.reduce((total, mao) => total + mao.length, 0)}`;
  }

  async function quadro(id) {
    if (id !== sessao) return;
    if (pronto && !ocupado && video.readyState >= 2 && video.currentTime !== ultimoTempo) {
      ocupado = true;
      ultimoTempo = video.currentTime;
      try {
        const frame = await createImageBitmap(video);
        if (id !== sessao) { frame.close(); return; }
        worker.postMessage({ type: 'frame', frame, timestamp: performance.now() }, [frame]);
      } catch (erro) {
        if (id === sessao) desligar(`Falha ao ler a câmera: ${erro.message}`);
        return;
      }
    }
    animacao = requestAnimationFrame(() => quadro(id));
  }

  iniciar.addEventListener('click', async () => {
    const id = ++sessao;
    iniciar.disabled = true;
    parar.disabled = false;
    status.textContent = 'Aguardando permissão da câmera…';
    try {
      const captura = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      if (id !== sessao) { captura.getTracks().forEach(track => track.stop()); return; }
      stream = captura;
      video.srcObject = stream;
      stream.getVideoTracks()[0].addEventListener('ended', () => { if (id === sessao) desligar('A câmera foi desconectada.'); });
      await video.play();
      if (id !== sessao) return;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      document.querySelector('.camera').style.aspectRatio = `${canvas.width}/${canvas.height}`;
      status.textContent = 'Câmera ligada. Carregando detector das mãos…';
      worker = new Worker('./hand-worker.js');
      prazo = setTimeout(() => { if (id === sessao) desligar('O detector demorou demais para carregar. Tente novamente.'); }, 45000);
      worker.onerror = () => { if (id === sessao) desligar('Erro ao iniciar o detector das mãos.'); };
      worker.onmessage = ({ data }) => {
        if (id !== sessao) return;
        if (data.type === 'ready') {
          clearTimeout(prazo);
          pronto = true;
          status.textContent = 'Detector pronto. Mostre suas mãos para a câmera.';
        } else if (data.type === 'result') {
          ocupado = false;
          desenhar(data);
        } else if (data.type === 'error') desligar(data.message);
      };
      worker.postMessage({ type: 'init' });
      quadro(id);
    } catch (erro) {
      if (id !== sessao) return;
      const mensagens = {
        NotAllowedError: 'Permissão negada. Libere a câmera nas permissões deste site e tente novamente.',
        NotFoundError: 'Nenhuma câmera encontrada no computador.',
        NotReadableError: 'Não foi possível abrir a câmera. Confira se outro aplicativo está usando ela.',
      };
      desligar(mensagens[erro.name] || `Não foi possível iniciar: ${erro.message}`);
    }
  });
  parar.addEventListener('click', () => desligar());
  window.addEventListener('pagehide', () => desligar());
</script>
</html>
